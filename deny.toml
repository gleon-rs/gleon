# Config for cargo-deny

[graph]
targets = []
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
ignore = [
    # `paste` is archived ("unmaintained", not a vulnerability) and has no safe upgrade. It is a
    # compile-time proc-macro pulled in only by `safer-ffi` (directly and via
    # `macro_rules_attribute`), so none of its code ends up in gleon-ffi. Drop this once safer-ffi
    # moves off it.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained proc-macro, transitive via safer-ffi; no runtime code" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "Unlicense",
    "BUSL-1.1",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
allow-workspace = false
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
