# Config for cargo-deny

[graph]
targets = []
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
# Unmaintained, without a fix: object_store (also the latest, 0.14.2) needs both crates. Remove
# these when object_store no longer does; then move off chrono (jiff or time) in one step.
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono: object_store needs it, no maintained release" },
    { id = "RUSTSEC-2026-0542", reason = "humantime: object_store needs it, no maintained release" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "Unlicense",
    "BUSL-1.1",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
allow-workspace = false
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
