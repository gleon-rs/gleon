version: 2
updates:
  - package-ecosystem: "cargo"
    # The fuzz targets are a workspace of their own, with their own lockfile.
    directories: ["/", "/fuzz"]
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "09:10"
      timezone: "Europe/Vienna"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "09:10"
      timezone: "Europe/Vienna"
