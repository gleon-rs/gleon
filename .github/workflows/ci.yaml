name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: 🚀 Build & Test
    runs-on: ubuntu-26.04

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🦀 Set up Rust (pinned nightly from rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: 📦 Install cargo-deny, cargo-audit, cargo-nextest and cargo-llvm-cov
        # Prebuilt, checksum-verified binaries; tool versions are pinned by the action's SHA.
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-deny,cargo-audit,cargo-nextest,cargo-llvm-cov
          fallback: none

      - name: ✨ Check formatting
        # `fuzz/` is a workspace of its own, which `--all` leaves out.
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path fuzz/Cargo.toml --all -- --check

      - name: 🔍 Lint with clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: 🔍 Validate action.yml
        # yq (preinstalled on the runner image) fails on invalid YAML and on metadata that is no
        # composite action with a string name and a string description.
        run: >-
          yq --exit-status '(.name | tag) == "!!str" and (.description | tag) == "!!str"
          and .runs.using == "composite"' action.yml

      - name: 🛑 Run cargo-deny checks
        run: cargo deny check

      - name: 🔒 Run cargo-audit checks
        run: cargo audit

      - name: 🧪 Run tests with code coverage
        # Single instrumented test run (nextest) instead of a plain `cargo test` followed by a coverage re-run.
        run: cargo llvm-cov nextest --all-features --workspace --lcov --output-path lcov.info

      - name: 📚 Run doctests
        # nextest does not run doctests.
        run: cargo test --workspace --all-features --doc

      - name: 📖 Check documentation links
        env:
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links
        run: cargo doc --workspace --all-features --no-deps

      - name: 📤 Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  library:
    # The configuration the Flutter package ships: `gleon-ffi` builds `gleon-engine` without its
    # `parallel` feature (sequential comparisons), which the feature-unified workspace run above
    # never compiles. Miri checks the unsafe boundary of the C ABI.
    name: 🧩 Library configuration and Miri
    runs-on: ubuntu-26.04

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🦀 Set up Rust (pinned nightly from rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: clippy, miri

      - name: 🔍 Lint the library crates without features
        run: cargo clippy --locked -p gleon-engine -p gleon-ffi --all-targets -- -D warnings

      - name: 🧪 Test the sequential engine (incl. the SSIM corpus)
        run: cargo test --locked -p gleon-engine

      - name: 🎯 Lint the fuzz targets
        # `fuzz/` is a workspace of its own, which no other step builds: its targets must compile
        # against the crates and the Dependabot updates of `fuzz/`. Dependabot updates only the
        # direct dependencies of `fuzz/`: a minimum the root workspace raises for a crate of the
        # engine or the model reaches `fuzz/Cargo.lock` by hand. A stale lockfile is a warning,
        # not a failure, which would turn the root workspace's Dependabot PRs red.
        run: |
          if ! cargo metadata --locked --format-version 1 --manifest-path fuzz/Cargo.toml > /dev/null; then
            echo "::warning file=fuzz/Cargo.lock::fuzz/Cargo.lock is behind the workspace: run 'cargo check' in fuzz/ and commit the lockfile"
          fi
          cargo clippy --manifest-path fuzz/Cargo.toml --bins -- -D warnings

      - name: 🔬 Build the Miri sysroot
        # The sysroot is the toolchain's own std, built from a manifest cargo generates: its
        # warnings (`unused_dependencies` on nightly) are not ours, so the action's
        # `CARGO_BUILD_WARNINGS=deny` would fail the build. The tests below still deny warnings.
        run: cargo miri setup
        env:
          CARGO_BUILD_WARNINGS: warn

      - name: 🔬 Run the ABI tests under Miri
        run: cargo miri test --locked -p gleon-ffi --lib

  host-platforms:
    # The crates depend on the host (`std::env::consts`: the platform that tracks the goldens,
    # platform keys that must be valid file names, path handling). macOS runs the full suite;
    # Windows the integration crates, until the paths of gleon-core and the CLI are checked there.
    name: 🖥️ Test and build the CLI on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-26, packages: --workspace }
          - { os: windows-2025, packages: -p gleon-model -p gleon-ffi }

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🦀 Set up Rust (pinned nightly from rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: 🧪 Run tests
        run: cargo test --locked ${{ matrix.packages }}

      # The CLI is released for this host too: the release must not be its first build.
      - name: 🔨 Build the CLI
        run: cargo build --locked -p gleon --bin gleon

      - name: ▶️ Run the CLI
        run: ./target/debug/gleon --help
