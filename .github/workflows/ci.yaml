name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: 🚀 Build & Test
    runs-on: ubuntu-26.04

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🦀 Set up Rust (pinned nightly from rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: 📦 Install cargo-deny, cargo-audit, cargo-nextest and cargo-llvm-cov
        # Prebuilt, checksum-verified binaries; tool versions are pinned by the action's SHA.
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-deny,cargo-audit,cargo-nextest,cargo-llvm-cov
          fallback: none

      - name: ✨ Check formatting
        run: cargo fmt --all -- --check

      - name: 🔍 Lint with clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: 🔍 Verify action.yml readability
        # TODO: Replace with real YAML parser or actionlint once available in CI
        run: node -e "require('fs').readFileSync('action.yml', 'utf8')"

      - name: 🛑 Run cargo-deny checks
        run: cargo deny check

      - name: 🔒 Run cargo-audit checks
        run: cargo audit

      - name: 🧪 Run tests with code coverage
        # Single instrumented test run (nextest) instead of a plain `cargo test` followed by a coverage re-run.
        run: cargo llvm-cov nextest --all-features --workspace --lcov --output-path lcov.info

      - name: 📚 Run doctests
        # nextest does not run doctests.
        run: cargo test --workspace --all-features --doc

      - name: 📤 Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
