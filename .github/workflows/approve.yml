name: Gleon Approve

on:
  workflow_call:
    inputs:
      version:
        description: "gleon version tag to use (e.g. v0.2.2 or latest)"
        type: string
        default: "latest"
      checksum:
        description: "SHA256 checksum of the binary (optional)"
        type: string
        required: false
        default: ""
      working-directory:
        description: "Directory to run gleon from"
        type: string
        default: "."
      pat-token:
        description: "Personal Access Token to use for git push and checkout (optional, defaults to GITHUB_TOKEN)"
        type: string
        required: false
        default: ""
      trigger-workflow:
        description: "Name of the CI workflow file to trigger after pushing baselines (e.g. verify_packages.yaml)"
        type: string
        required: false
        default: ""
    secrets:
      R2_ACCOUNT_ID:
        required: false
      GLEON_STORAGE_URL:
        required: false
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false

permissions: {}

jobs:
  approve:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/gleon approve')
    runs-on: ubuntu-26.04
    permissions:
      actions: write
      contents: write
      pull-requests: read
    steps:
      - name: Verify Collaborator
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const permission = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor,
            });
            if (permission.data.permission !== 'admin' && permission.data.permission !== 'write') {
              core.setFailed(`User ${context.actor} does not have write access.`);
            }

      - name: Get PR Info & Security Check
        id: pr-info
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            // Security: Reject PRs from forks to prevent untrusted code execution
            if (!pr.data.head.repo || pr.data.head.repo.full_name !== pr.data.base.repo.full_name) {
              core.setFailed("Refusing to approve PRs from forks due to security risks.");
            }

            core.setOutput("head_sha", pr.data.head.sha);
            core.setOutput("head_ref", pr.data.head.ref);

      # Security: Checkout trusted base repository code only (satisfies CodeQL).
      - name: Checkout Base Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ inputs.pat-token || github.token }}
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0

      # Security: Restore existing PR baseline manifests without checking out untrusted branch code
      - name: Fetch PR Manifests
        shell: bash
        env:
          HEAD_SHA: ${{ steps.pr-info.outputs.head_sha }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          set -eo pipefail
          git fetch origin "$HEAD_SHA"
          # Clear base manifests so deleted PR manifests are not retained
          rm -rf "$WORKING_DIRECTORY/.gleon/manifests"
          if git ls-tree -d "$HEAD_SHA" "$WORKING_DIRECTORY/.gleon/manifests" 2>/dev/null | grep -q .; then
            git archive "$HEAD_SHA" "$WORKING_DIRECTORY/.gleon/manifests" | tar -x -C .
            echo "Restored existing manifests from PR branch $HEAD_SHA."
          fi

      - name: Validate Storage Configuration
        shell: bash
        env:
          STORAGE_URL: ${{ secrets.GLEON_STORAGE_URL }}
        run: |
          if [ -z "$STORAGE_URL" ]; then
            echo "::error::GLEON_STORAGE_URL secret is missing or empty. A valid remote storage URL is required to approve and sync baselines."
            exit 1
          fi

      - name: Pull Existing Baseline Blobs
        uses: gleon-rs/gleon@main
        with:
          version: ${{ inputs.version }}
          checksum: ${{ inputs.checksum }}
          command: "pull"
          working-directory: ${{ inputs.working-directory }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          GLEON_STORAGE_URL: ${{ secrets.GLEON_STORAGE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # Only the runs of the PR's head commit: an artifact of an earlier commit (a job that has
      # passed since and uploads nothing) must never be approved.
      - name: Download Artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.pr-info.outputs.head_sha }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -eo pipefail
          mkdir -p .gleon-downloads
          for run_id in $(gh run list --commit "$HEAD_SHA" --limit 100 --json databaseId -q '.[].databaseId'); do
            # A run without gleon artifacts has nothing to download.
            gh run download "$run_id" -p "gleon-artifacts-$PR_NUMBER-*" -D ".gleon-downloads/$run_id" || true
          done

      # Each artifact is the `.gleon/runs/` of one CI job: approved as its own run, so the cases of
      # different platforms never overwrite each other (each goes to its platform's manifests).
      # Passed as a JSON array, so paths with spaces (matrix job names) stay whole.
      - name: Collect Runs
        id: runs
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -eo pipefail
          FROM=()
          for run in "$GITHUB_WORKSPACE"/.gleon-downloads/*/*/latest; do
            if [ -d "$run" ]; then FROM+=(--from "$run"); fi
          done
          if [ "${#FROM[@]}" -eq 0 ]; then
            echo "::error::No verification artifacts (.gleon/runs/latest) found for PR #$PR_NUMBER."
            exit 1
          fi
          echo "args=$(jq -cn '$ARGS.positional' --args "${FROM[@]}")" >> "$GITHUB_OUTPUT"
          # Goldens written after this are the approved ones (see Commit and Push).
          touch "$RUNNER_TEMP/gleon-approve.stamp"

      - name: Run Gleon Approve
        uses: gleon-rs/gleon@main
        with:
          version: ${{ inputs.version }}
          checksum: ${{ inputs.checksum }}
          command: "approve"
          args: ${{ steps.runs.outputs.args }}
          working-directory: ${{ inputs.working-directory }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          # Security: Pass untrusted comment body via env variable to prevent script injection
          COMMENT_BODY: ${{ github.event.comment.body }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          GLEON_STORAGE_URL: ${{ secrets.GLEON_STORAGE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Push Approved Blobs to Storage
        uses: gleon-rs/gleon@main
        with:
          version: ${{ inputs.version }}
          checksum: ${{ inputs.checksum }}
          command: "push"
          working-directory: ${{ inputs.working-directory }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          GLEON_STORAGE_URL: ${{ secrets.GLEON_STORAGE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Commit and Push
        shell: bash
        env:
          HEAD_REF: ${{ steps.pr-info.outputs.head_ref }}
          HEAD_SHA: ${{ steps.pr-info.outputs.head_sha }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          PUSH_TOKEN: ${{ inputs.pat-token || github.token }}
        run: |
          set -eo pipefail
          # PNG goldens of integrations that approve wrote: every one, even one equal to the base
          # branch's (the checkout) that the PR had changed.
          mapfile -t GOLDENS < <(find "$WORKING_DIRECTORY" -type f -iname '*.png' \
            -newer "$RUNNER_TEMP/gleon-approve.stamp" \
            -not -path '*/.git/*' -not -path '*/.gleon/*' -not -path '*/.gleon-downloads/*')
          export GIT_INDEX_FILE=.git/tmp_index
          rm -f "$GIT_INDEX_FILE"

          # 1. Load PR branch tree into temporary index
          git read-tree "$HEAD_SHA"
          if [ "${#GOLDENS[@]}" -gt 0 ]; then
            git add -- "${GOLDENS[@]}"
          fi

          # 2. Stage updated manifests into the temporary index
          if [ -d "$WORKING_DIRECTORY/.gleon/manifests" ]; then
            git add -A "$WORKING_DIRECTORY/.gleon/manifests"
          else
            git rm -r --ignore-unmatch "$WORKING_DIRECTORY/.gleon/manifests"
          fi

          # 3. Write updated tree
          NEW_TREE=$(git write-tree)
          unset GIT_INDEX_FILE
          rm -f .git/tmp_index

          HEAD_TREE=$(git rev-parse "$HEAD_SHA^{tree}")
          if [ "$NEW_TREE" = "$HEAD_TREE" ]; then
            echo "No baseline changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            NEW_COMMIT=$(git commit-tree "$NEW_TREE" -p "$HEAD_SHA" -m "chore(gleon): update baseline images")
            git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$NEW_COMMIT:refs/heads/$HEAD_REF"
            echo "Pushed new baseline commit $NEW_COMMIT to $HEAD_REF."
          fi

      - name: Trigger CI Re-run
        if: ${{ inputs.trigger-workflow != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ steps.pr-info.outputs.head_ref }}
          TRIGGER_WORKFLOW: ${{ inputs.trigger-workflow }}
        run: |
          echo "Triggering workflow '$TRIGGER_WORKFLOW' on ref '$HEAD_REF'..."
          if ! gh workflow run "$TRIGGER_WORKFLOW" --ref "$HEAD_REF"; then
            echo "::warning::Failed to trigger '$TRIGGER_WORKFLOW' via workflow_dispatch. Note: GitHub requires the workflow to define 'workflow_dispatch:' in its 'on:' block on the default branch (main)."
          fi
