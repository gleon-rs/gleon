name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
            binary_name: gleon
            asset_name: gleon-linux-x86_64
          - os: macos-26
            target: aarch64-apple-darwin
            binary_name: gleon
            asset_name: gleon-macos-aarch64
          # The C runtime linked in: no Visual C++ redistributable needed.
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            binary_name: gleon.exe
            asset_name: gleon-windows-x86_64.exe
            rustflags: -C target-feature=+crt-static

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust (pinned nightly from rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
          rustc --version

      - name: Build release binary
        env:
          GLEON_OFFICIAL_SECRET: ${{ secrets.GLEON_OFFICIAL_SECRET }}
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          if [ -z "${GLEON_OFFICIAL_SECRET}" ]; then
            echo "::error::GLEON_OFFICIAL_SECRET is not configured"
            exit 1
          fi
          export GLEON_BUILD_TIMESTAMP=$(date +%s)
          cargo build --locked --release --bin gleon --target ${{ matrix.target }}

      - name: Prepare asset
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/${{ matrix.asset_name }}

      - name: Generate Build Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/${{ matrix.asset_name }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.target }}
          path: dist/*
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          merge-multiple: true
          path: dist/

      # One tool for every asset (as in the Flutter package's release).
      - name: Write checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*
