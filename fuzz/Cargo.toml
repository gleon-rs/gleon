[package]
name = "gleon-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
gleon-engine = { path = "../gleon-engine" }
gleon-model = { path = "../gleon-model" }
semver = "1"

# A workspace of its own: the fuzz targets need nightly sanitizer flags and stay out of the
# main workspace lints, builds and `cargo deny`.
[workspace]
members = ["."]

[[bin]]
name = "decode_png"
path = "fuzz_targets/decode_png.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_config"
path = "fuzz_targets/parse_config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compare_raw"
path = "fuzz_targets/compare_raw.rs"
test = false
doc = false
bench = false
