[workspace]
resolver = "3"
members = [
    "gleon-engine",
    "gleon-ffi",
    "gleon-core",
    "gleon"
]

[workspace.package]
authors = ["tsinis"]
edition = "2024"
license = "BUSL-1.1"
version = "0.2.2"
publish = false
rust-version = "1.100"


[workspace.dependencies]
anyhow = "1.0.103"
assert_cmd = "2.2.2"

bytemuck = "1.25.2"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.4", features = ["derive", "env"] }
dialoguer = "0.12.0"
dotenvy = "0.15.7"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
base64 = "0.23.1"
futures = "0.3.33"
getrandom = "0.4.3"
gix = { version = "0.87.1", default-features = false, features = ["sha1", "revision", "index"] }
globset = "0.4.19"
hex = "0.4.3"
http = "1.2.0"
ignore = "0.4.31"
image = { version = "0.25.5", default-features = false, features = ["png"] }
indicatif = "0.18.6"
image_hasher = "3.1.1"
libc = "0.2"
minijinja = "2.21.0"
object_store = { version = "0.14.1", features = ["aws", "gcp"] }
predicates = "3.1.4"
rayon = "1.12.0"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = { package = "yaml_serde", version = "0.10.4" }
sha2 = "0.11.0"
zeroize = "1.9.0"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"


[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
# Transitive dependency version skew is outside our control (upstream crates
# pin different minor versions of the same dependency); tracked by `cargo deny`.
multiple_crate_versions = "allow"
expect_used = "deny"
nursery = { level = "deny", priority = -1 }
panic = "deny"
pedantic = { level = "deny", priority = -1 }
todo = "deny"
unwrap_used = "deny"
# Selected `restriction` lints that enforce rules from `.agents/AGENTS.md`.
# Every `#[allow]`/`#[expect]` must say why; point suppression use `#[expect]` so stale ones fail.
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
# "Allocation-Free String Appending": use `write!`/`writeln!` instead of `push_str(&format!(..))`.
format_push_string = "deny"

# Distributed CLI binary: trade longer release builds for a smaller, faster executable.
# `panic` stays at the default `unwind` on purpose.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
