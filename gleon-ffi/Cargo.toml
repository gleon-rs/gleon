[package]
name = "gleon-ffi"
description = "C ABI over gleon-engine for test framework integrations (the gleon Flutter package today)."
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "MIT OR Apache-2.0"
publish.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
chrono = { workspace = true }
gleon-engine = { path = "../gleon-engine" }
gleon-model = { path = "../gleon-model" }
safer-ffi = { workspace = true }

[dev-dependencies]
# Test builds only: the C header snapshot (`include/gleon_ffi.h`).
safer-ffi = { workspace = true, features = ["headers"] }
image = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
