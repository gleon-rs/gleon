name: "gleon Visual Regression"
description: "Runs visual diff checks and handles approval pipelines"
branding:
  color: "orange"
  icon: "image"

inputs:
  version:
    description: "gleon version tag to download (e.g. 'v0.3.0' or 'latest')"
    required: false
    default: "latest"
  license-key:
    description: "gleon BSL License Key for private repositories"
    required: false
    default: ""
  strict:
    description: "Fail build on license violation ('true' or 'false')"
    required: false
    default: "false"
  target-branch:
    description: "Target branch for baseline comparison (defaults to PR base ref or default branch)"
    required: false
    default: "${{ github.base_ref || github.event.repository.default_branch || 'main' }}"
  command:
    description: "gleon command to execute (e.g. 'diff', 'pull', 'approve', 'verify')"
    required: false
    default: "diff"
  working-directory:
    description: "Directory to run gleon from (useful for monorepos)"
    required: false
    default: "."
  args:
    description: "Additional arguments for the selected gleon command (for 'verify': of `gleon test` or `gleon diff`): whitespace-separated, or a JSON array of strings (e.g. '[\"--from\", \"dl/linux/latest\"]' for approve)"
    required: false
    default: ""
  test-command:
    description: "For 'verify': the test command of an integration that compares its goldens itself (e.g. 'flutter test' for the gleon Flutter package), whitespace-separated or a JSON array of strings. Verify then runs `gleon test -- <command>` instead of `gleon pull` and `gleon diff`. The report and the uploaded run are those of the workspace in `working-directory`: for workspaces nested below it (packages of a monorepo with their own .gleon/), use one step per workspace"
    required: false
    default: ""
  github-token:
    description: "GitHub token to prevent API rate limits when downloading releases (optional)"
    required: false
    default: "${{ github.token }}"
  checksum:
    description: "Expected SHA256 checksum of the binary for independent trust verification (optional)"
    required: false
    default: ""
  pr-number:
    description: "Pull Request number (for 'verify' command reporting)"
    required: false
    default: "${{ github.event.pull_request.number }}"
  artifact-name:
    description: "Name of the artifact to upload on failure (for 'verify' command)"
    required: false
    default: "gleon-artifacts-${{ github.event.pull_request.number }}-default"

runs:
  using: "composite"
  steps:
    - name: Resolve OS, Architecture and Binary Name
      id: resolve
      shell: bash
      run: |
        OS="${{ runner.os }}"
        ARCH="${{ runner.arch }}"

        # The assets of a release: Linux x64, macOS on Apple silicon, Windows x64.
        case "$OS" in
          Linux)
            case "$ARCH" in
              X64)   TARGET="linux-x86_64" ;;
              *) echo "::error::Unsupported Linux architecture: $ARCH"; exit 1 ;;
            esac
            BIN_NAME="gleon"
            ;;
          macOS)
            case "$ARCH" in
              ARM64) TARGET="macos-aarch64" ;;
              *) echo "::error::Unsupported macOS architecture: $ARCH"; exit 1 ;;
            esac
            BIN_NAME="gleon"
            ;;
          Windows)
            case "$ARCH" in
              X64)   TARGET="windows-x86_64.exe" ;;
              *) echo "::error::Unsupported Windows architecture: $ARCH"; exit 1 ;;
            esac
            BIN_NAME="gleon.exe"
            ;;
          *) echo "::error::Unsupported OS: $OS"; exit 1 ;;
        esac

        SETUP_DIR="${{ runner.temp }}/gleon_setup"
        mkdir -p "$SETUP_DIR"

        echo "target=$TARGET" >> $GITHUB_OUTPUT
        echo "bin_name=$BIN_NAME" >> $GITHUB_OUTPUT
        echo "setup_dir=$SETUP_DIR" >> $GITHUB_OUTPUT

    - name: Fetch and Verify gleon Binary
      shell: bash
      env:
        GLEON_VERSION: ${{ inputs.version }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        CHECKSUM: ${{ inputs.checksum }}
        BIN_PATH: "${{ steps.resolve.outputs.setup_dir }}/${{ steps.resolve.outputs.bin_name }}"
      run: |
        VERSION="$GLEON_VERSION"
        if [ "$VERSION" = "latest" ] || [ -z "$VERSION" ]; then
          BASE_URL="https://github.com/gleon-rs/gleon/releases/latest/download"
        else
          if [[ "$VERSION" =~ ^[0-9] ]]; then
            VERSION="v${VERSION}"
          fi
          BASE_URL="https://github.com/gleon-rs/gleon/releases/download/${VERSION}"
        fi

        ASSET_NAME="gleon-${{ steps.resolve.outputs.target }}"
        SETUP_DIR="${{ steps.resolve.outputs.setup_dir }}"
        BIN_PATH="${SETUP_DIR}/${{ steps.resolve.outputs.bin_name }}"

        echo "Downloading ${BASE_URL}/${ASSET_NAME}..."

        CURL_ARGS=("-fsSL")
        if [ -n "$GITHUB_TOKEN" ]; then
          CURL_ARGS+=("-H" "Authorization: token $GITHUB_TOKEN")
        fi

        curl "${CURL_ARGS[@]}" "${BASE_URL}/${ASSET_NAME}" -o "$BIN_PATH"

        node -e "
        const fs = require('fs');
        const crypto = require('crypto');

        const binPath = process.env.BIN_PATH;
        let expected = process.env.CHECKSUM ? process.env.CHECKSUM.trim() : '';

        if (!expected) {
          console.log('No SHA256 checksum provided, skipping checksum verification.');
          process.exit(0);
        }

        const colonIdx = expected.indexOf(':');
        if (colonIdx !== -1) {
          expected = expected.substring(colonIdx + 1);
        }

        const actual = crypto.createHash('sha256').update(fs.readFileSync(binPath)).digest('hex');

        if (expected.toLowerCase() !== actual.toLowerCase()) {
          console.error(\`SHA256 mismatch! Expected: \${expected}, Got: \${actual}\`);
          process.exit(1);
        }
        "

    - name: Add gleon Binary to PATH
      shell: bash
      run: |
        chmod +x "${{ steps.resolve.outputs.setup_dir }}/${{ steps.resolve.outputs.bin_name }}"
        echo "${{ steps.resolve.outputs.setup_dir }}" >> $GITHUB_PATH

    # `args` and `test-command`, each whitespace-separated or a JSON array of strings, as
    # NUL-separated files the later steps read into bash arrays (no word splitting or globbing).
    - name: Parse Arguments
      id: parse
      shell: bash
      env:
        GLEON_ARGS: ${{ inputs.args }}
        GLEON_TEST_COMMAND: ${{ inputs.test-command }}
        ARGS_FILE: ${{ runner.temp }}/gleon-args.nul
        TEST_COMMAND_FILE: ${{ runner.temp }}/gleon-test-command.nul
      run: |
        node -e "
        const fs = require('fs');
        const parse = (name) => {
          const raw = (process.env[name] || '').trim();
          if (!raw) return [];
          if (!raw.startsWith('[')) return raw.split(/\s+/).filter(Boolean);
          let parsed;
          try { parsed = JSON.parse(raw); } catch (e) { parsed = null; }
          if (!Array.isArray(parsed)) {
            console.error('::error::' + name + ' is no JSON array of strings');
            process.exit(1);
          }
          return parsed.map(String);
        };
        const write = (file, list) =>
          fs.writeFileSync(file, Buffer.concat(list.map(a => Buffer.concat([Buffer.from(a), Buffer.from([0])]))));
        write(process.env.ARGS_FILE, parse('GLEON_ARGS'));
        write(process.env.TEST_COMMAND_FILE, parse('GLEON_TEST_COMMAND'));
        "
        echo "args_file=$ARGS_FILE" >> "$GITHUB_OUTPUT"
        echo "test_command_file=$TEST_COMMAND_FILE" >> "$GITHUB_OUTPUT"

    - name: Execute Single Command
      if: inputs.command != 'verify'
      shell: bash
      env:
        GLEON_LICENSE_KEY: ${{ inputs.license-key }}
        GLEON_STRICT: ${{ inputs.strict }}
        GLEON_TARGET_BRANCH: ${{ inputs.target-branch }}
        GLEON_COMMAND: ${{ inputs.command }}
        GLEON_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        ARGS_FILE: ${{ steps.parse.outputs.args_file }}
        COMMENT_BODY: ${{ env.COMMENT_BODY }}
      run: |
        args=()
        while IFS= read -r -d '' arg; do
          args+=("$arg")
        done < "$ARGS_FILE"

        # Parse extra filter arguments from PR comment if running approve via comment
        if [ "$GLEON_COMMAND" = "approve" ] && [ -n "$COMMENT_BODY" ]; then
          if ! ARG_STRING="$(node -e "
            const raw = process.env.COMMENT_BODY || '';
            const command = raw.match(/(?:^|\n)\s*\/gleon approve(?:\s+([^\r\n]*))?\s*(?:\r?\n|$)/);
            if (!command) {
              console.error('::error::No standalone /gleon approve command found in comment.');
              process.exit(1);
            }
            const rest = (command[1] || '').trim();
            if (rest) {
              const tokens = rest.split(/\s+/).filter(Boolean);
              // Test names, golden paths or `<platform>/<test name>` (platform keys hold `+` and
              // `=`) only: a comment never passes flags (`--from`, ...).
              for (const token of tokens) {
                if (token.startsWith('-') || !/^[A-Za-z0-9._/+=-]+$/.test(token)) {
                  console.error('::error::Invalid argument token (test names, golden paths or <platform>/<test name> only): ' + token);
                  process.exit(1);
                }
              }
              console.log(tokens.join(' '));
            }
          ")"; then
            exit 1
          fi
          if [ -n "$ARG_STRING" ]; then
            read -r -a TOKENS <<< "$ARG_STRING"
            args+=("${TOKENS[@]}")
          fi
        fi

        cd "$GLEON_WORKING_DIRECTORY"
        gleon "$GLEON_COMMAND" "${args[@]}"

    - name: Verify - Pull Baselines
      if: inputs.command == 'verify' && inputs.test-command == ''
      shell: bash
      env:
        GLEON_LICENSE_KEY: ${{ inputs.license-key }}
        GLEON_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        cd "$GLEON_WORKING_DIRECTORY"
        gleon pull

    # The tests of an integration (`test-command`) write their own case reports; otherwise
    # `gleon diff` compares the screenshots with the manifests. The output is kept for the PR
    # comment when no report can be rendered.
    - name: Verify - Run Tests or Diff
      id: verify
      if: inputs.command == 'verify'
      shell: bash
      env:
        GLEON_LICENSE_KEY: ${{ inputs.license-key }}
        GLEON_STRICT: ${{ inputs.strict }}
        GLEON_TARGET_BRANCH: ${{ inputs.target-branch }}
        GLEON_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        TEST_COMMAND_FILE: ${{ steps.parse.outputs.test_command_file }}
        ARGS_FILE: ${{ steps.parse.outputs.args_file }}
        VERIFY_LOG: ${{ runner.temp }}/gleon-verify.log
        # Stamps the case reports of this run; the report step reads exactly this run.
        GLEON_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      run: |
        set -o pipefail
        test_command=()
        while IFS= read -r -d '' arg; do
          test_command+=("$arg")
        done < "$TEST_COMMAND_FILE"
        # `args` go to the gleon command of the mode (e.g. `--platform`, `--artifacts`).
        args=()
        while IFS= read -r -d '' arg; do
          args+=("$arg")
        done < "$ARGS_FILE"
        cd "$GLEON_WORKING_DIRECTORY"
        if [ "${#test_command[@]}" -gt 0 ]; then
          gleon test "${args[@]}" -- "${test_command[@]}" 2>&1 | tee "$VERIFY_LOG"
        else
          gleon diff "${args[@]}" 2>&1 | tee "$VERIFY_LOG"
        fi

    # Only when the tests or the diff failed: a failed download, argument parsing or pull ran no
    # tests, and its own error is in the log.
    - name: Verify - Generate Report & Post Comment
      if: inputs.command == 'verify' && failure() && steps.verify.outcome == 'failure' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GLEON_HTML_ARTIFACT_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        PR_NUMBER: ${{ inputs.pr-number }}
        GLEON_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        GLEON_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        VERIFY_LOG: ${{ runner.temp }}/gleon-verify.log
      run: |
        cd "$GLEON_WORKING_DIRECTORY"
        if ! gleon report --pr-number "$PR_NUMBER" markdown > gleon-report.md; then
          # No case reports (the tests failed before comparing, or no screenshots matched): the
          # end of the run's output, which tells why, goes to the job log, never into the public
          # comment (it may hold anything the tests printed).
          echo "::warning::This run recorded no case reports; the end of its output follows."
          echo "::group::End of the run's output"
          tail -n 30 "$VERIFY_LOG" 2>/dev/null || echo "(no output recorded)"
          echo "::endgroup::"
          {
            echo "### ⚠️ Gleon Visual Regression Failed"
            echo "This run recorded no case reports: the tests failed before comparing, or no screenshot matched a rule. See the end of the run's output in the [job log](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
          } > gleon-report.md
        fi
        gh pr comment "$PR_NUMBER" --body-file gleon-report.md || echo "Failed to post PR comment. Does the token have pull-requests: write permission?"

    - name: Verify - Upload Artifacts
      if: inputs.command == 'verify' && failure() && steps.verify.outcome == 'failure' && github.event_name == 'pull_request'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        # The whole run output: `latest/` (case reports, images) and a custom `artifacts:` dir.
        path: ${{ inputs.working-directory }}/.gleon/runs/
        retention-days: 7
