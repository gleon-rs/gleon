name: "gleon Visual Regression"
description: "Runs visual diff checks and handles approval pipelines"
branding:
  color: "orange"
  icon: "image"

inputs:
  version:
    description: "gleon version tag to download (e.g. 'v0.2.2' or 'latest')"
    required: false
    default: "latest"
  license-key:
    description: "gleon BSL License Key for private repositories"
    required: false
    default: ""
  strict:
    description: "Fail build on license violation ('true' or 'false')"
    required: false
    default: "false"
  target-branch:
    description: "Target branch for baseline comparison (defaults to PR base ref or default branch)"
    required: false
    default: "${{ github.base_ref || github.event.repository.default_branch || 'main' }}"
  command:
    description: "gleon command to execute (e.g. 'diff', 'pull', 'approve', 'verify')"
    required: false
    default: "diff"
  working-directory:
    description: "Directory to run gleon from (useful for monorepos)"
    required: false
    default: "."
  args:
    description: "Additional arguments for the selected gleon command: whitespace-separated, or a JSON array of strings (e.g. '[\"--from\", \"dl/linux/latest\"]' for approve)"
    required: false
    default: ""
  github-token:
    description: "GitHub token to prevent API rate limits when downloading releases (optional)"
    required: false
    default: "${{ github.token }}"
  checksum:
    description: "Expected SHA256 checksum of the binary for independent trust verification (optional)"
    required: false
    default: ""
  pr-number:
    description: "Pull Request number (for 'verify' command reporting)"
    required: false
    default: "${{ github.event.pull_request.number }}"
  artifact-name:
    description: "Name of the artifact to upload on failure (for 'verify' command)"
    required: false
    default: "gleon-artifacts-${{ github.event.pull_request.number }}-default"

runs:
  using: "composite"
  steps:
    - name: Resolve OS, Architecture and Binary Name
      id: resolve
      shell: bash
      run: |
        OS="${{ runner.os }}"
        ARCH="${{ runner.arch }}"

        case "$OS" in
          Linux)
            case "$ARCH" in
              X64)   TARGET="linux-x86_64" ;;
              ARM64) TARGET="linux-aarch64" ;;
              *) echo "::error::Unsupported Linux architecture: $ARCH"; exit 1 ;;
            esac
            BIN_NAME="gleon"
            ;;
          macOS)
            case "$ARCH" in
              ARM64) TARGET="macos-aarch64" ;;
              X64)   TARGET="macos-x86_64" ;;
              *) echo "::error::Unsupported macOS architecture: $ARCH"; exit 1 ;;
            esac
            BIN_NAME="gleon"
            ;;
          Windows)
            case "$ARCH" in
              X64)   TARGET="windows-x86_64.exe" ;;
              *) echo "::error::Unsupported Windows architecture: $ARCH"; exit 1 ;;
            esac
            BIN_NAME="gleon.exe"
            ;;
          *) echo "::error::Unsupported OS: $OS"; exit 1 ;;
        esac

        SETUP_DIR="${{ runner.temp }}/gleon_setup"
        mkdir -p "$SETUP_DIR"

        echo "target=$TARGET" >> $GITHUB_OUTPUT
        echo "bin_name=$BIN_NAME" >> $GITHUB_OUTPUT
        echo "setup_dir=$SETUP_DIR" >> $GITHUB_OUTPUT

    - name: Fetch and Verify gleon Binary
      shell: bash
      env:
        GLEON_VERSION: ${{ inputs.version }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        CHECKSUM: ${{ inputs.checksum }}
        BIN_PATH: "${{ steps.resolve.outputs.setup_dir }}/${{ steps.resolve.outputs.bin_name }}"
      run: |
        VERSION="$GLEON_VERSION"
        if [ "$VERSION" = "latest" ] || [ -z "$VERSION" ]; then
          BASE_URL="https://github.com/gleon-rs/gleon/releases/latest/download"
        else
          if [[ "$VERSION" =~ ^[0-9] ]]; then
            VERSION="v${VERSION}"
          fi
          BASE_URL="https://github.com/gleon-rs/gleon/releases/download/${VERSION}"
        fi

        ASSET_NAME="gleon-${{ steps.resolve.outputs.target }}"
        SETUP_DIR="${{ steps.resolve.outputs.setup_dir }}"
        BIN_PATH="${SETUP_DIR}/${{ steps.resolve.outputs.bin_name }}"

        echo "Downloading ${BASE_URL}/${ASSET_NAME}..."

        CURL_ARGS=("-fsSL")
        if [ -n "$GITHUB_TOKEN" ]; then
          CURL_ARGS+=("-H" "Authorization: token $GITHUB_TOKEN")
        fi

        curl "${CURL_ARGS[@]}" "${BASE_URL}/${ASSET_NAME}" -o "$BIN_PATH"

        node -e "
        const fs = require('fs');
        const crypto = require('crypto');

        const binPath = process.env.BIN_PATH;
        let expected = process.env.CHECKSUM ? process.env.CHECKSUM.trim() : '';

        if (!expected) {
          console.log('No SHA256 checksum provided, skipping checksum verification.');
          process.exit(0);
        }

        const colonIdx = expected.indexOf(':');
        if (colonIdx !== -1) {
          expected = expected.substring(colonIdx + 1);
        }

        const actual = crypto.createHash('sha256').update(fs.readFileSync(binPath)).digest('hex');

        if (expected.toLowerCase() !== actual.toLowerCase()) {
          console.error(\`SHA256 mismatch! Expected: \${expected}, Got: \${actual}\`);
          process.exit(1);
        }
        "

    - name: Add gleon Binary to PATH
      shell: bash
      run: |
        chmod +x "${{ steps.resolve.outputs.setup_dir }}/${{ steps.resolve.outputs.bin_name }}"
        echo "${{ steps.resolve.outputs.setup_dir }}" >> $GITHUB_PATH

    - name: Execute Single Command
      if: inputs.command != 'verify'
      shell: bash
      env:
        GLEON_LICENSE_KEY: ${{ inputs.license-key }}
        GLEON_STRICT: ${{ inputs.strict }}
        GLEON_TARGET_BRANCH: ${{ inputs.target-branch }}
        GLEON_COMMAND: ${{ inputs.command }}
        GLEON_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        GLEON_ARGS: ${{ inputs.args }}
        COMMENT_BODY: ${{ env.COMMENT_BODY }}
      run: |
        args=()
        if [ -n "$GLEON_ARGS" ]; then
          ARGS_FILE=$(mktemp)
          node -e "
          const fs = require('fs');
          const raw = (process.env.GLEON_ARGS || '').trim();
          let args = [];
          if (raw.startsWith('[')) {
            try { args = JSON.parse(raw); } catch (e) { process.exit(1); }
          } else if (raw) {
            args = raw.split(/\s+/).filter(Boolean);
          }
          const buf = Buffer.concat(args.map(a => Buffer.concat([Buffer.from(String(a)), Buffer.from([0])])));
          fs.writeFileSync(process.argv[1], buf);
          " "$ARGS_FILE" || exit 1
          while IFS= read -r -d '' arg; do
            args+=("$arg")
          done < "$ARGS_FILE"
          rm -f "$ARGS_FILE"
        fi

        # Parse extra filter arguments from PR comment if running approve via comment
        if [ "$GLEON_COMMAND" = "approve" ] && [ -n "$COMMENT_BODY" ]; then
          if ! ARG_STRING="$(node -e "
            const raw = process.env.COMMENT_BODY || '';
            const command = raw.match(/(?:^|\n)\s*\/gleon approve(?:\s+([^\r\n]*))?\s*(?:\r?\n|$)/);
            if (!command) {
              console.error('::error::No standalone /gleon approve command found in comment.');
              process.exit(1);
            }
            const rest = (command[1] || '').trim();
            if (rest) {
              const tokens = rest.split(/\s+/).filter(Boolean);
              // Test names or golden paths only: a comment never passes flags (`--from`, ...).
              for (const token of tokens) {
                if (token.startsWith('-') || !/^[A-Za-z0-9._/:=-]+$/.test(token)) {
                  console.error('::error::Invalid argument token (test names or golden paths only): ' + token);
                  process.exit(1);
                }
              }
              console.log(tokens.join(' '));
            }
          ")"; then
            exit 1
          fi
          if [ -n "$ARG_STRING" ]; then
            read -r -a TOKENS <<< "$ARG_STRING"
            args+=("${TOKENS[@]}")
          fi
        fi

        cd "$GLEON_WORKING_DIRECTORY"
        gleon "$GLEON_COMMAND" "${args[@]}"

    - name: Verify - Pull Baselines
      if: inputs.command == 'verify'
      shell: bash
      env:
        GLEON_LICENSE_KEY: ${{ inputs.license-key }}
        GLEON_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        cd "$GLEON_WORKING_DIRECTORY"
        gleon pull

    - name: Verify - Run Diff
      if: inputs.command == 'verify'
      shell: bash
      env:
        GLEON_LICENSE_KEY: ${{ inputs.license-key }}
        GLEON_STRICT: ${{ inputs.strict }}
        GLEON_TARGET_BRANCH: ${{ inputs.target-branch }}
        GLEON_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        # Stamps the case reports of this run; the report step reads exactly this run.
        GLEON_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      run: |
        cd "$GLEON_WORKING_DIRECTORY"
        gleon diff

    - name: Verify - Generate Report & Post Comment
      if: inputs.command == 'verify' && failure() && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GLEON_HTML_ARTIFACT_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        PR_NUMBER: ${{ inputs.pr-number }}
        GLEON_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        GLEON_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      run: |
        cd "$GLEON_WORKING_DIRECTORY"
        if ! gleon report --pr-number "$PR_NUMBER" markdown > gleon-report.md; then
          echo "::warning::Failed to generate markdown report from the case reports. Outputting minimal fallback."
          echo "### ⚠️ Gleon Visual Regression Failed" > gleon-report.md
          echo "The report generator could not read the case reports of this run. Please check the Action logs." >> gleon-report.md
        fi
        gh pr comment "$PR_NUMBER" --body-file gleon-report.md || echo "Failed to post PR comment. Does the token have pull-requests: write permission?"

    - name: Verify - Upload Artifacts
      if: inputs.command == 'verify' && failure() && github.event_name == 'pull_request'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        # The whole run output: `latest/` (case reports, images) and a custom `artifacts:` dir.
        path: ${{ inputs.working-directory }}/.gleon/runs/
        retention-days: 7
