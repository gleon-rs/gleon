[package]
name = "gleon"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
keygen = [
    "gleon-core/keygen",
    "dep:base64",
    "dep:ed25519-dalek",
    "dep:getrandom",
    "dep:globset",
    "dep:hex",
    "dep:zeroize",
]

[[bin]]
name = "gleon"
path = "src/main.rs"

[[bin]]
name = "keygen"
path = "src/bin/keygen.rs"
required-features = ["keygen"]

[[test]]
name = "keygen_test"
path = "tests/keygen_test.rs"
required-features = ["keygen"]

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true, optional = true }
chrono = { workspace = true }
clap = { workspace = true }
dialoguer = { workspace = true }
ed25519-dalek = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
gleon-core = { path = "../gleon-core" }
gleon-model = { path = "../gleon-model" }
globset = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
indicatif = { workspace = true }
libc = { workspace = true }
serde_json = { workspace = true }
zeroize = { workspace = true, optional = true }
# `gleon test` supervises the test command and its signals.
tokio = { workspace = true, features = ["process", "signal"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }

[package.metadata.cargo-udeps.ignore]
normal = ["gleon-core"]
